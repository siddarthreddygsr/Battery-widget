<svg xmlns="http://w3.org" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F2F2F2"/>
      <stop offset="85%" stop-color="#D6D6D6"/>
      <stop offset="100%" stop-color="#B5B5B5"/>
    </linearGradient>
    <linearGradient id="touchGradR" x1="70%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EEAEAEA"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
    <radialGradient id="tipGradR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="70%" stop-color="#B8B8B8"/>
      <stop offset="100%" stop-color="#8E8E8E"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="3" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Right Earbud Main Body -->
  <path d="M30,30 C40,15 65,20 75,40 C85,60 80,80 65,90 C50,100 25,95 20,75 C15,55 20,45 30,30 Z" fill="url(#bodyGradR)" stroke="#3A3A3A" stroke-width="2.5" filter="url(#shadow)" stroke-linejoin="round"/>
  
  <!-- Glossy Outer Touch Accent Zone -->
  <path d="M50,38 C55,28 65,32 70,45 C75,58 72,70 62,75 C52,80 42,72 40,60 C38,48 45,48 50,38 Z" fill="url(#touchGradR)" stroke="#BEBEBE" stroke-width="1"/>
  
  <!-- Subtle Highlight on Touch Panel Rim -->
  <path d="M68,42 C70,48 69,58 64,68" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Silicone Tip (Facing angled inward) -->
  <ellipse cx="31" cy="65" rx="14" ry="18" transform="rotate(25, 31, 65)" fill="url(#tipGradR)" stroke="#5A5A5A" stroke-width="1.5"/>
  <ellipse cx="31" cy="65" rx="5" ry="7" transform="rotate(25, 31, 65)" fill="#444444"/>
  
  <!-- Metallic Charging Contacts -->
  <circle cx="58" cy="85" r="2.5" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  <circle cx="50" cy="87" r="2.5" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  
  <!-- Right Marker -->
  <text x="65" y="60" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#A0A0A0" text-anchor="middle">R</text>
</svg>
