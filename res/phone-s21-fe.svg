<svg xmlns="http://www.w3.org/2000/svg" width="745" height="1557" viewBox="0 0 745 1557">

  <title>Samsung Galaxy S21 FE rear outline</title>

  <g fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer phone body: proportions based on 74.5 x 155.7 mm -->

    <rect x="18" y="18" width="709" height="1521" rx="88"/>

    <rect x="27" y="27" width="691" height="1503" rx="80" stroke-width="1.8"/>

    <!-- Camera island integrated into the top-left corner; extends about one-third of phone height -->

    <g transform="translate(42 44) scale(1.5) translate(-42 -44)">
      <path d="M 192,33.8 V 330 C 192,357 164,380 116,380 H 33"/>
      <circle cx="111" cy="101" r="42"/>
      <circle cx="111" cy="101" r="31" stroke-width="2"/>
      <circle cx="111" cy="211" r="42"/>
      <circle cx="111" cy="211" r="31" stroke-width="2"/>
      <circle cx="111" cy="321" r="42"/>
      <circle cx="111" cy="321" r="31" stroke-width="2"/>
    </g>

    <!-- LED flash remains outside the enlarged island, aligned with the top lens -->

    <circle cx="310" cy="130" r="24"/>

    <!-- Side buttons -->

    <rect x="8" y="292" width="10" height="150" rx="5" stroke-width="2.5"/>

    <rect x="8" y="496" width="10" height="91" rx="5" stroke-width="2.5"/>

  </g>

</svg>
