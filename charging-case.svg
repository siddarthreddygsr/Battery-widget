<svg xmlns="http://w3.org" viewBox="0 0 180 120" width="100%" height="100%">
  <defs>
    <!-- Case body smooth 3D gradient -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FAFAFA"/>
      <stop offset="65%" stop-color="#EBEBEB"/>
      <stop offset="100%" stop-color="#C5C5C5"/>
    </linearGradient>
    <!-- Shadow beneath the top lid lip -->
    <linearGradient id="seamShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5A5A5"/>
      <stop offset="100%" stop-color="#EBEBEB" stop-opacity="0"/>
    </linearGradient>
    <filter id="caseShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main Case Body -->
  <rect x="15" y="20" width="150" height="80" rx="40" ry="40" fill="url(#caseGrad)" stroke="#3A3A3A" stroke-width="2.5" filter="url(#caseShadow)"/>

  <!-- Shadow below the seam line to give a overlapping lid effect -->
  <path d="M16,55 Q90,58 164,55 L164,60 Q90,63 16,60 Z" fill="url(#seamShadow)" opacity="0.5"/>

  <!-- Sharp Lid Seam Line -->
  <path d="M15.5,55 Q90,58 164.5,55" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
  
  <!-- Front Opening Indentation Finger Notch (Carved-in Look) -->
  <path d="M75,58 Q90,64 105,58 Q90,57 75,58 Z" fill="#D0D0D0" stroke="#999999" stroke-width="0.5"/>
  
  <!-- Breathing LED Status Indicator Light -->
  <circle cx="90" cy="78" r="3.5" fill="#00FF66"/>
  <circle cx="90" cy="78" r="6" fill="#00FF66" opacity="0.4"/>
</svg>
